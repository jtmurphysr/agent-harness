[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
requires-python = ">=3.11"
description = "Triumvirate Review Subsystem - Multi-agent code review harness"

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "rich>=13",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "typer>=0.12",
    "PyYAML>=6.0",
    "jinja2>=3.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.21",
    "types-PyYAML",
]


[tool.setuptools]
py-modules = []
packages = [
    "templates",
    "renderer",
    "cli",
    "github",
    "stonehaven",
    "reviewers",
    "verdict_store",
    "notifications",
    "interview",
    "tests"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short -m \"not slow\""
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "docs/*",
    ".venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["scripts/", "tests/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "templates",
    "renderer",
    "cli",
    "github",
    "stonehaven",
    "reviewers",
    "verdict_store",
    "notifications",
    "interview"
]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/", "scripts/"]