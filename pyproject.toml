[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
requires-python = ">=3.11"
description = "Triumvirate Review Subsystem - Multi-agent code review harness"

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "rich>=13",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "typer>=0.12",
    "PyYAML>=6.0",
    "jinja2>=3.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.21",
    "types-PyYAML",
]


[tool.setuptools]
py-modules = []
packages = [
    "templates",
    "renderer",
    "cli",
    "github",
    "stonehaven",
    "reviewers",
    "verdict_store",
    "notifications",
    "interview",
    "tests"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short -m \"not slow\""
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "docs/*",
    ".venv/*"
]

[tool.coverage.report]
# Two decimals: at the default integer precision every value in [84.50, 85.49]
# prints as "85%", so a file just under the floor reads as compliant in every
# log it appears in -- including the report the GC agent is handed (#14).
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# extend-exclude, not exclude: `exclude` REPLACES ruff's defaults (.venv, .git,
# build, dist, node_modules...), so a bare `exclude = [...]` unexcludes all of them.
# Nothing is listed because nothing should be: tests/ and scripts/ are linted like
# everything else. AGENTS.md says "ruff + mypy strict, no exceptions" and for a
# long time this line was the exception. See #12 and #15.
extend-exclude = []

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "templates",
    "renderer",
    "cli",
    "github",
    "stonehaven",
    "reviewers",
    "verdict_store",
    "notifications",
    "interview"
]

[tool.mypy]
python_version = "3.11"
strict = true
# RATCHET, not a resolution of #12. tests/ is now inside mypy's tree so the debt is
# visible and cannot grow -- but it is not yet held to --strict. Measured at
# 347 errors / 23 files when unexcluded: 228 no-untyped-def (mechanical, `-> None`)
# and ~70 attr-defined/method-assign (real: MagicMock assigned to typed callables,
# which is a fixture-design decision). Those land as their own PR. Until then the
# override below keeps tests/ checked at non-strict so the number only goes down.
#
# scripts/ stays excluded from mypy only: it has no __init__.py, so mypy sees each
# script twice ("validate_harness" and "scripts.validate_harness") and refuses to
# run. Unexcluding it is a packaging decision, not a lint one.
exclude = ["scripts/"]

[[tool.mypy.overrides]]
module = "tests.*"
# Step 1 of the ratchet: 228 mechanical `-> None` omissions are waived; 118 real
# findings remain (50 attr-defined = MagicMock attributes on typed callables,
# 17 method-assign, 19 arg-type = int|None passed where int expected, 16 type-arg).
# Those are fixture-design decisions and land as their own PR. Until then the two
# error codes that carry them are waived HERE, explicitly, so removing a line from
# this list is the act that turns the check back on -- nothing is silently ignored.
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_calls = false
disable_error_code = ["attr-defined", "method-assign", "arg-type", "type-arg", "var-annotated", "valid-type", "misc", "no-untyped-call"]