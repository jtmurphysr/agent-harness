name: Agent Dispatch

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to dispatch manually'
        required: true
        type: string

jobs:
  # The holding-label gate, and the ONLY place it lives. Both dispatch jobs
  # `needs` this one and check its output, the way ci.yml's auto-merge checks
  # workflow-guard.
  #
  # Why a job and not an `if:` clause: the `issues` event carries the issue's
  # labels in its payload, so the old job-level `if:` could refuse human-review
  # there. `workflow_dispatch` carries only an issue NUMBER, and that is the
  # path close-issue-on-merge.yml uses to advance the chain after every merge.
  # So the label check existed on the path nobody automated and was absent on
  # the one that fires unattended. On 2026-09-20 downstream, #57 merged and an
  # agent was dispatched against #58 -- human-review + harness-gap, parked for
  # a decision -- with only the DEPENDS ON gate in its way (issue #26).
  #
  # This job runs on every trigger and reads the labels via REST. If it cannot
  # read them it FAILS, and a failed `needs` skips both dispatch jobs: a gate
  # that cannot see its input has not passed. It never edits labels and never
  # comments -- a held issue is waiting on a human, and the correct response is
  # a quiet skip in the workflow log, not noise on the issue.
  refuse-held:
    name: Holding-label gate
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'agent-task') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/agent retry')) ||
      github.event_name == 'workflow_dispatch'
    permissions:
      issues: read
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number || github.event.issue.number }}
        run: |
          set -uo pipefail
          VERDICT=$(bash scripts/refuse-held-issue.sh "$REPO" "$ISSUE") || {
            echo "::error::refuse-held-issue.sh failed (exit $?) for #${ISSUE} — gate is broken, not passed. Refusing to dispatch."
            exit 1
          }
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          case "$VERDICT" in
            clear)  echo "#${ISSUE}: clear to dispatch." ;;
            held\ *) echo "::notice::#${ISSUE} carries ${VERDICT#held } — not dispatching. A human has not decided yet." ;;
            *)      echo "::error::unexpected verdict '$VERDICT' — refusing to dispatch."; exit 1 ;;
          esac

  dispatch-on-label:
    name: Dispatch Agent
    runs-on: ubuntu-latest
    needs: refuse-held
    # The label conditions that used to sit here are now the refuse-held job
    # above, which sees both paths. What remains is trigger selection only.
    if: |
      needs.refuse-held.outputs.verdict == 'clear' &&
      (
        (github.event_name == 'issues' && github.event.label.name == 'agent-task') ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure git identity
        run: |
          git config --global user.name "claude-agent[bot]"
          git config --global user.email "claude-agent[bot]@users.noreply.github.com"
      # close-issue-on-merge.yml dispatches this job from the SAME merge event that
      # starts compound-learning.yml, so the previous cycle's AGENTS.md edits land on
      # main seconds AFTER the next branch is cut. Measured downstream at twelve
      # seconds: the next agent read a constitution without the warning the previous
      # cycle had just written, and shipped the exact defect it warned about (#13).
      #
      # Two deliberate properties, both load-bearing:
      #   1. The wait is capped at 10 minutes (30 checks x 20s).
      #   2. On timeout it WARNS and proceeds -- it does not fail. A hung or
      #      long-running manual learning job must not permanently block the
      #      pipeline. `gh run list --workflow` returns runs across all branches,
      #      which is what we want (the learning job runs on main) but also means a
      #      manual invocation can hold dispatch for the full cap. Warn-and-proceed
      #      is the safety valve; do not turn it into a hard failure.
      - name: Wait for compound-learning to land
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for i in $(seq 1 30); do
            RUNNING=$(gh run list --repo ${{ github.repository }} \
              --workflow compound-learning.yml --status in_progress \
              --json databaseId --jq 'length')
            QUEUED=$(gh run list --repo ${{ github.repository }} \
              --workflow compound-learning.yml --status queued \
              --json databaseId --jq 'length')
            if [ "$RUNNING" = "0" ] && [ "$QUEUED" = "0" ]; then
              echo "compound-learning idle after ${i} checks."
              exit 0
            fi
            echo "compound-learning busy (in_progress=$RUNNING queued=$QUEUED) — waiting 20s"
            sleep 20
          done
          echo "::warning::compound-learning still running after 10 minutes — proceeding."
      # The checkout above predates the wait, so it predates whatever
      # compound-learning just pushed. Re-point it at current main so the agent reads
      # the AGENTS.md that exists now rather than the one from the merge event (#13).
      #
      # `git checkout origin/main --detach` DISCARDS the working tree. It is safe only
      # here: after the wait, before the agent writes any file and before the branch is
      # cut. Moving it later would silently destroy the agent's work.
      - name: Refresh main
        run: git fetch origin main && git checkout origin/main --detach
      - name: Check sequential dependency
        id: dep-check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISSUE_NUM="${{ github.event.inputs.issue_number }}"
          else
            ISSUE_NUM="${{ github.event.issue.number }}"
          fi
          echo "issue_num=${ISSUE_NUM}" >> $GITHUB_OUTPUT
          ISSUE_BODY=$(gh issue view "$ISSUE_NUM" \
            --repo ${{ github.repository }} \
            --json body -q '.body')
          # The gate is one tested script, shared with the retry site below. It
          # resolves the FIRST #N on the DEPENDS ON line as a GitHub issue, falls
          # back to the canonical "Issue #0NN" title for old chain bodies, and
          # FAILS CLOSED on anything it cannot resolve. The inline version this
          # replaced "assumed satisfied" on a lookup miss, which meant every
          # GC-filed or hand-written predecessor went ungated. See issue #11 and
          # scripts/test-resolve-predecessor.sh.
          VERDICT=$(printf '%s\n' "$ISSUE_BODY" \
            | bash scripts/resolve-predecessor.sh "${{ github.repository }}") || {
            echo "::error::resolve-predecessor.sh failed (exit $?) — gate is broken, not passed. Refusing to dispatch."
            echo "blocked=true" >> $GITHUB_OUTPUT
            echo "reason=error" >> $GITHUB_OUTPUT
            exit 0
          }
          echo "gate: $VERDICT"
          set -- $VERDICT
          case "$1" in
            proceed)
              echo "blocked=false" >> $GITHUB_OUTPUT
              ;;
            blocked)
              echo "blocked=true" >> $GITHUB_OUTPUT
              echo "reason=open" >> $GITHUB_OUTPUT
              echo "predecessor=$2" >> $GITHUB_OUTPUT
              ;;
            unresolved)
              echo "blocked=true" >> $GITHUB_OUTPUT
              echo "reason=unresolved" >> $GITHUB_OUTPUT
              shift; echo "predecessor=$*" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "::error::unexpected gate verdict: $VERDICT — refusing to dispatch."
              echo "blocked=true" >> $GITHUB_OUTPUT
              echo "reason=error" >> $GITHUB_OUTPUT
              ;;
          esac
      - name: Halt — predecessor not closed
        if: steps.dep-check.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ISSUE_NUM="${{ steps.dep-check.outputs.issue_num }}"
          PRED="${{ steps.dep-check.outputs.predecessor }}"
          REASON="${{ steps.dep-check.outputs.reason }}"
          gh issue edit "$ISSUE_NUM" \
            --repo ${{ github.repository }} \
            --remove-label "agent-task"
          case "$REASON" in
            open)
              MSG="Sequential gate: blocked. Predecessor GitHub #${PRED} is not yet closed. The agent-task label has been removed. Re-apply it once #${PRED} is closed to dispatch this agent."
              ;;
            unresolved)
              MSG="Sequential gate: blocked. The DEPENDS ON line names \`${PRED}\`, which does not resolve to any issue in this repo (neither as a GitHub number nor as a canonical \`Issue #0NN\` title). Fix the DEPENDS ON line, then re-apply the agent-task label. The gate does not assume an unresolvable predecessor is satisfied."
              ;;
            *)
              MSG="Sequential gate: could not run (internal error — see the workflow log). The agent-task label has been removed as a precaution. This is a harness bug, not an issue with your DEPENDS ON line."
              ;;
          esac
          gh issue comment "$ISSUE_NUM" --repo ${{ github.repository }} --body "$MSG"
          echo "::error::Blocked (${REASON}) — ${PRED}. Label removed."
          exit 1
      - name: Acknowledge dispatch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NUM: ${{ steps.dep-check.outputs.issue_num }}
        run: |
          gh issue comment "$ISSUE_NUM" \
            --repo ${{ github.repository }} \
            --body "Agent dispatched. Sequential dependency verified. Reading AGENTS.md and issue spec. Will open a PR when complete. Add human-review label at any time to block auto-merge. Comment /agent retry to re-dispatch if needed."
      # v1 removed the `mode` input -- detectMode() infers it. That inference is
      # not a no-op here: an issues event carrying a prompt resolves to agent
      # mode (detector.ts:54), which would silently drop the tracking comment
      # this step has always posted. track_progress: true forces tag mode back
      # for issues/issue_comment/pull_request events, preserving behaviour.
      #
      # The two steps below remain mutually exclusive via their if: conditions.
      - name: Run Claude Code agent (label dispatch)
        if: github.event_name == 'issues'
        uses: anthropics/claude-code-action@3a122873511595739e21e685a5bc0fad9638e250  # v1.0.201
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # GH_WORKFLOW_PAT (repo + workflow scope), not GH_PAT: this is the token the
          # agent pushes with, and pushes that touch .github/workflows/ are rejected
          # without `workflow` scope (#19). The compensating control is the
          # workflow-guard job in ci.yml, which forces human-review on any such PR.
          # Every other GH_PAT use in this file is read/label/comment and stays as is.
          github_token: ${{ secrets.GH_WORKFLOW_PAT }}
          track_progress: true
          label_trigger: "agent-task"
          claude_args: --allowedTools "Bash,Edit,Write,Read,Glob,Grep,LS,TodoRead,TodoWrite"
          prompt: |
            You are operating in an agent-first repository.

            MANDATORY FIRST STEPS — do these in order, before writing any code:
            1. Read AGENTS.md in full. It is your operating constitution.
            2. Read docs/PRD.md to ground yourself in the project domain.
            3. Read docs/learnings/ — all files if present. Apply every warning.

            Before writing a single line of code, output this confirmation:
            "I am implementing [issue title]. The files I will create are: [list FILES TO CREATE from the issue spec]."

            If you cannot complete that sentence from the issue spec, do not proceed.

            Note: Sequential dependency has already been verified by the workflow gate.

            GIT WORKFLOW — confirm branch before writing any file:
            ISSUE_NUM="${{ steps.dep-check.outputs.issue_num }}"
            CURRENT=$(git branch --show-current)
            if [[ "$CURRENT" == claude/* ]]; then
              echo "Already on harness branch: $CURRENT"
            else
              BRANCH="claude/issue-${ISSUE_NUM}-$(date +%Y%m%d-%H%M)"
              git checkout -b "$BRANCH"
              git push -u origin "$BRANCH"
            fi

            Never commit or push to main.

            WRITE A PR BODY WORTH REVIEWING. Your PR body is the input to three machine
            reviewers (review-engineer / review-architect / review-sre) and to the
            spec-conformance gate. A body that says only "Implements Issue #N" gives a
            reviewer judging claim-against-diff no claims to judge, and gives the
            `claimed-not-changed` check nothing to check. Write it in exactly this shape:

            Closes #${ISSUE_NUM}

            ## What
            <one paragraph: what this PR does, in terms of the issue's CONTEXT>

            ## Files
            - `path` — what changed and why (one line each; every path here must be in the diff)

            ## Verified
            <the five-step sequence result, test counts, anything run by hand>

            ## Not done / out of scope
            <anything from the issue left undone, and why — or "nothing">

            Two rules the gates enforce on that body:
            - The closing keyword stays FIRST and names YOUR issue and no other.
              close-issue-on-merge.yml and the spec-conformance gate both act on the
              first one in the body, and under auto-merge nobody reads it before GitHub
              does. For any other issue your PR advances, write `Refs #N` instead.
            - Every backticked path in the prose must be a path your diff touches.
              The gate fails `claimed-not-changed` on a path you claim and did not change.

            AFTER THE PR IS OPEN — three reviewers run on it, in parallel, blind to each
            other. A `VERDICT: BLOCK` from any one of them is a HARD MERGE-FAIL: the job
            fails, auto-merge requires all three to have succeeded, and the PR does not
            merge. A reviewer that produces no parseable verdict fails the same way. If a
            review-* job fails, read its comment on the PR and address every BLOCKING line.
      - name: Run Claude Code agent (workflow dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@3a122873511595739e21e685a5bc0fad9638e250  # v1.0.201
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # GH_WORKFLOW_PAT (repo + workflow scope), not GH_PAT: this is the token the
          # agent pushes with, and pushes that touch .github/workflows/ are rejected
          # without `workflow` scope (#19). The compensating control is the
          # workflow-guard job in ci.yml, which forces human-review on any such PR.
          # Every other GH_PAT use in this file is read/label/comment and stays as is.
          github_token: ${{ secrets.GH_WORKFLOW_PAT }}
          # No track_progress: workflow_dispatch is not an entity event, so
          # detectMode() falls through to agent -- the behaviour this step
          # already had. Setting it here would throw in validateTrackProgressEvent.
          claude_args: --allowedTools "Bash,Edit,Write,Read,Glob,Grep,LS,TodoRead,TodoWrite"
          prompt: |
            You are operating in an agent-first repository.

            MANDATORY FIRST STEPS — do these in order, before writing any code:
            1. Read AGENTS.md in full. It is your operating constitution.
            2. Read docs/PRD.md to ground yourself in the project domain.
            3. Read docs/learnings/ — all files if present. Apply every warning.

            Before writing a single line of code, output this confirmation:
            "I am implementing [issue title]. The files I will create are: [list FILES TO CREATE from the issue spec]."

            If you cannot complete that sentence from the issue spec, do not proceed.

            Note: Sequential dependency has already been verified by the workflow gate.

            GIT WORKFLOW — branch creation is the FIRST git operation:
            ISSUE_NUM="${{ steps.dep-check.outputs.issue_num }}"
            BRANCH="claude/issue-${ISSUE_NUM}-$(date +%Y%m%d-%H%M)"
            git checkout -b "$BRANCH"
            git push -u origin "$BRANCH"

            Do not read, write, or create any file before the branch exists and is pushed.
            Never commit or push to main.

            YOUR TASK:
            Fetch the full issue spec by running:
              gh issue view ${{ steps.dep-check.outputs.issue_num }} --repo ${{ github.repository }}

            SCOPE ENFORCEMENT — non-negotiable:
            - Create ONLY the files listed in FILES TO CREATE in the issue spec.
            - Modify ONLY the files listed in FILES TO MODIFY in the issue spec.
            - Do NOT create any file not explicitly listed.
            - Do NOT implement logic belonging to a later issue.
            - If a dependency doesn't exist yet, stub it with a NotImplementedError.

            BEFORE OPENING A PR — hard-required sequence, no exceptions:
            1. mypy --strict .
            2. pytest tests/ --cov=. -q
            3. ruff check --fix .
            4. ruff format .            ← LAST file-editing step — always
            5. ruff check .             ← verify clean, no --fix flag
            All five must exit 0. If any step fails: fix it, then restart from step 1.
            ruff format MUST be the final edit before git add. Any code written after
            ruff format runs will cause CI to fail on format check.

            OPENING THE PR — use gh CLI:
            ISSUE_NUM="${{ steps.dep-check.outputs.issue_num }}"
            BRANCH=$(git branch --show-current)

            WRITE A BODY WORTH REVIEWING. Your PR body is the input to three machine
            reviewers (review-engineer / review-architect / review-sre) and to the
            spec-conformance gate. A body that says only "Implements Issue #N" gives a
            reviewer judging claim-against-diff no claims to judge, and gives the
            `claimed-not-changed` check nothing to check. Write it, in exactly the shape
            below, to a file OUTSIDE the worktree — /tmp/pr-body.md, never a path inside
            the repository. A body file you commit is a path outside the issue's FILES
            sections and fails the scope check. Then pass it with --body-file:

            Closes #${ISSUE_NUM}

            ## What
            <one paragraph: what this PR does, in terms of the issue's CONTEXT>

            ## Files
            - `path` — what changed and why (one line each; every path here must be in the diff)

            ## Verified
            <the five-step sequence result, test counts, anything run by hand>

            ## Not done / out of scope
            <anything from the issue left undone, and why — or "nothing">

            Two rules the gates enforce on that body:
            - The closing keyword stays FIRST and names YOUR issue and no other.
              close-issue-on-merge.yml and the spec-conformance gate both act on the
              first one in the body, and under auto-merge nobody reads it before GitHub
              does. For any other issue your PR advances, write `Refs #N` instead.
            - Every backticked path in the prose must be a path your diff touches.
              The gate fails `claimed-not-changed` on a path you claim and did not change.

            gh pr create \
              --title "Issue #${ISSUE_NUM}: $(gh issue view ${ISSUE_NUM} --repo ${{ github.repository }} --json title -q '.title')" \
              --body-file /tmp/pr-body.md \
              --head "$BRANCH" \
              --base main \
              --repo ${{ github.repository }} \
              --label "agent-task"

            AFTER THE PR IS OPEN — three reviewers run on it, in parallel, blind to each
            other. A `VERDICT: BLOCK` from any one of them is a HARD MERGE-FAIL: the job
            fails, auto-merge requires all three to have succeeded, and the PR does not
            merge. A reviewer that produces no parseable verdict fails the same way. If a
            review-* job fails, read its comment on the PR and address every BLOCKING line.

            If a capability is missing:
            - Do NOT approximate or work around it
            - Open a separate issue with label harness-gap
            - Comment on this issue referencing the blocker
            - Do not open a partial PR
      - name: Guard — abort if agent branch has no commits
        if: success()
        uses: actions/github-script@v7
        env:
          ISSUE_NUM: ${{ steps.dep-check.outputs.issue_num }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const issueNum = process.env.ISSUE_NUM;
            const branches = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const issueBranch = branches.data.find(b =>
              b.name.startsWith(`claude/issue-${issueNum}-`)
            );
            if (!issueBranch) {
              console.log('No agent branch found — skipping empty-branch guard.');
              return;
            }
            // ahead_by === 0 against live main cannot distinguish "the agent committed
            // nothing" from "the agent's PR already merged." Downstream this fired
            // sixteen seconds after a green merge, posted a re-dispatch instruction
            // that would have redone merged work, and failed a run that had shipped.
            // Check for a merged PR with this head FIRST (#140).
            const merged = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              head: `${context.repo.owner}:${issueBranch.name}`,
              per_page: 5,
            });
            const mergedPr = merged.data.find(pr => pr.merged_at);
            if (mergedPr) {
              console.log(`Branch ${issueBranch.name} was merged as PR #${mergedPr.number} at ${mergedPr.merged_at} — cycle complete, not empty.`);
              return;
            }
            const compare = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `main...${issueBranch.name}`,
            });
            if (compare.data.ahead_by === 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNum),
                body: `Agent ran but produced **0 commits** on \`${issueBranch.name}\`. No PR created. Empty branch deleted.\n\nRe-dispatch: \`gh workflow run agent-dispatch.yml -f issue_number=${issueNum}\``,
              });
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${issueBranch.name}`,
              });
              core.setFailed(`Agent produced 0 commits on ${issueBranch.name} — empty branch deleted, no PR created.`);
            } else {
              console.log(`Branch ${issueBranch.name} has ${compare.data.ahead_by} commit(s) vs main — proceeding.`);
            }

      - name: Create PR from agent branch (fallback)
        if: success()
        uses: actions/github-script@v7
        env:
          ISSUE_NUM: ${{ steps.dep-check.outputs.issue_num }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const issueNum = process.env.ISSUE_NUM || context.issue.number;
            const branches = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const issueBranch = branches.data.find(b =>
              b.name.startsWith(`claude/issue-${issueNum}-`)
            );
            if (!issueBranch) {
              console.log('No agent branch found — agent may have opened PR directly.');
              return;
            }
            const existingPRs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${issueBranch.name}`,
              state: 'open',
            });
            if (existingPRs.data.length > 0) {
              console.log(`PR already exists: #${existingPRs.data[0].number}`);
              return;
            }
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Issue #${issueNum}`,
              body: `Implements Issue #${issueNum}\n\nCloses #${issueNum}\n\nGenerated with Claude Code`,
              head: issueBranch.name,
              base: 'main',
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.data.number,
              labels: ['agent-task'],
            });

      - name: Ensure PR body contains Closes reference
        if: always()
        uses: actions/github-script@v7
        env:
          ISSUE_NUM: ${{ steps.dep-check.outputs.issue_num }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const issueNum = process.env.ISSUE_NUM;
            // Find any open PR for this issue's branch
            const branches = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const issueBranch = branches.data.find(b =>
              b.name.startsWith(`claude/issue-${issueNum}-`)
            );
            if (!issueBranch) return;

            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${issueBranch.name}`,
              state: 'open',
            });
            if (prs.data.length === 0) return;

            const pr = prs.data[0];
            const body = pr.body || '';
            if (/Closes\s+#\d+/i.test(body)) {
              console.log(`PR #${pr.number} already has Closes reference.`);
              return;
            }

            const newBody = body + `\n\nCloses #${issueNum}`;
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: newBody,
            });
            console.log(`Patched PR #${pr.number} — appended Closes #${issueNum}`);

  dispatch-on-retry:
    name: Retry Agent
    runs-on: ubuntu-latest
    needs: refuse-held
    # `/agent retry` never checked human-review either: a retry on an issue a
    # human had since parked re-ran the agent. Same gate, same job, same reason.
    if: |
      needs.refuse-held.outputs.verdict == 'clear' &&
      github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, '/agent retry') &&
      contains(github.event.issue.labels.*.name, 'agent-task')
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure git identity
        run: |
          git config --global user.name "claude-agent[bot]"
          git config --global user.email "claude-agent[bot]@users.noreply.github.com"
      # close-issue-on-merge.yml dispatches this job from the SAME merge event that
      # starts compound-learning.yml, so the previous cycle's AGENTS.md edits land on
      # main seconds AFTER the next branch is cut. Measured downstream at twelve
      # seconds: the next agent read a constitution without the warning the previous
      # cycle had just written, and shipped the exact defect it warned about (#13).
      #
      # Two deliberate properties, both load-bearing:
      #   1. The wait is capped at 10 minutes (30 checks x 20s).
      #   2. On timeout it WARNS and proceeds -- it does not fail. A hung or
      #      long-running manual learning job must not permanently block the
      #      pipeline. `gh run list --workflow` returns runs across all branches,
      #      which is what we want (the learning job runs on main) but also means a
      #      manual invocation can hold dispatch for the full cap. Warn-and-proceed
      #      is the safety valve; do not turn it into a hard failure.
      - name: Wait for compound-learning to land
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for i in $(seq 1 30); do
            RUNNING=$(gh run list --repo ${{ github.repository }} \
              --workflow compound-learning.yml --status in_progress \
              --json databaseId --jq 'length')
            QUEUED=$(gh run list --repo ${{ github.repository }} \
              --workflow compound-learning.yml --status queued \
              --json databaseId --jq 'length')
            if [ "$RUNNING" = "0" ] && [ "$QUEUED" = "0" ]; then
              echo "compound-learning idle after ${i} checks."
              exit 0
            fi
            echo "compound-learning busy (in_progress=$RUNNING queued=$QUEUED) — waiting 20s"
            sleep 20
          done
          echo "::warning::compound-learning still running after 10 minutes — proceeding."
      # The checkout above predates the wait, so it predates whatever
      # compound-learning just pushed. Re-point it at current main so the agent reads
      # the AGENTS.md that exists now rather than the one from the merge event (#13).
      #
      # `git checkout origin/main --detach` DISCARDS the working tree. It is safe only
      # here: after the wait, before the agent writes any file and before the branch is
      # cut. Moving it later would silently destroy the agent's work.
      - name: Refresh main
        run: git fetch origin main && git checkout origin/main --detach
      - name: Check sequential dependency (retry)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ISSUE_NUM="${{ github.event.issue.number }}"
          ISSUE_BODY=$(gh issue view "$ISSUE_NUM" \
            --repo ${{ github.repository }} \
            --json body -q '.body')
          # Same tested gate as the dispatch site. See issue #11.
          VERDICT=$(printf '%s\n' "$ISSUE_BODY" \
            | bash scripts/resolve-predecessor.sh "${{ github.repository }}") || {
            echo "::error::resolve-predecessor.sh failed (exit $?) — gate is broken, not passed. Refusing retry."
            exit 1
          }
          echo "gate: $VERDICT"
          set -- $VERDICT
          case "$1" in
            proceed)
              exit 0
              ;;
            blocked)
              gh issue comment "$ISSUE_NUM" \
                --repo ${{ github.repository }} \
                --body "Retry blocked — predecessor GitHub #${2} is not yet closed (state: ${3:-UNKNOWN}). Close it first, then retry."
              echo "::error::Retry blocked — predecessor GitHub #${2} is not closed."
              exit 1
              ;;
            unresolved)
              shift
              gh issue comment "$ISSUE_NUM" \
                --repo ${{ github.repository }} \
                --body "Retry blocked — the DEPENDS ON line names \`$*\`, which does not resolve to any issue in this repo. Fix the DEPENDS ON line, then retry. The gate does not assume an unresolvable predecessor is satisfied."
              echo "::error::Retry blocked — unresolved predecessor: $*"
              exit 1
              ;;
            *)
              echo "::error::unexpected gate verdict: $VERDICT — refusing retry."
              exit 1
              ;;
          esac
      - name: Acknowledge retry
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Agent retrying. Reading current state and diagnosing previous attempt.'
            });
      - name: Run Claude Code agent (retry)
        uses: anthropics/claude-code-action@3a122873511595739e21e685a5bc0fad9638e250  # v1.0.201
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # GH_WORKFLOW_PAT (repo + workflow scope), not GH_PAT: this is the token the
          # agent pushes with, and pushes that touch .github/workflows/ are rejected
          # without `workflow` scope (#19). The compensating control is the
          # workflow-guard job in ci.yml, which forces human-review on any such PR.
          # Every other GH_PAT use in this file is read/label/comment and stays as is.
          github_token: ${{ secrets.GH_WORKFLOW_PAT }}
          # issue_comment is an entity event, so without this detectMode()
          # would return agent (detector.ts:41) and drop the tracking comment.
          track_progress: true
          trigger_phrase: "/agent retry"
          claude_args: --allowedTools "Bash,Edit,Write,Read,Glob,Grep,LS,TodoRead,TodoWrite"
          prompt: |
            You are retrying a previous agent task on issue #${{ github.event.issue.number }}.

            FIRST: Read AGENTS.md in full.
            SECOND: Read docs/PRD.md to re-ground yourself in the project domain.
            THIRD: Read docs/learnings/ — all files.
            FOURTH: Check if a PR already exists and review CI failures.
            FIFTH: Read every comment on the PR from a `review-*` job before touching
            anything, and address each BLOCKING line or say why it is wrong. Those
            comments are written by review-engineer / review-architect / review-sre and
            are the reason a BLOCKed PR did not merge. Disputing a finding does not
            clear it: the reviewer, not you, decides whether the dispute holds, and the
            PR still has to re-review clean before it can merge. If you believe a
            finding is wrong, say so in the PR body and make the change re-reviewable.
            SIXTH: Diagnose the failure. Fix only what failed. Do not rewrite correct code.

            If no branch exists yet for this issue, create one first:
            ISSUE_NUM="${{ github.event.issue.number }}"
            BRANCH="claude/issue-${ISSUE_NUM}-$(date +%Y%m%d-%H%M)"
            git checkout -b "$BRANCH"
            git push -u origin "$BRANCH"

            Issue: ${{ github.event.issue.title }}
            Body:
            ---
            ${{ github.event.issue.body }}
            ---
