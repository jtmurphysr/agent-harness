          # line the agent gets the SDK's read-only default set and nothing
          # else -- v1 does not read .claude/settings.json. gc-agent.yml ran for
          # three weeks green, producing nothing, on exactly that omission.
          #
          # #29 specified `Read,Grep,Glob,Bash(git diff:*),Bash(git log:*)` and
