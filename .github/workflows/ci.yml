          fi
          # Both spellings: the raw execution file carries the ARRAY
          # `permission_denials`; the action's own sanitised summary carries the
          # scalar `permission_denials_count`. Reading only one of them is how
          # this number turns into a confident 0.
          DENIALS=$(jq '[.[] | select(.type == "result")] | last
                        | (.permission_denials_count // (.permission_denials | length) // 0)' "$EXEC_FILE")
          echo "permission_denials_count: $DENIALS"
          if [ "$DENIALS" != "0" ]; then
            echo "::warning::review-$ROLE hit $DENIALS permission denial(s) — the claude_args tool grant is too narrow for what this reviewer tried to read."
          fi

          jq -r '[.[] | select(.type == "result")] | last | .result // ""' "$EXEC_FILE" > "$RUNNER_TEMP/review.txt"

          # The verify step is this script and nothing else. Exit 0 = PASS/WARN,
          # 1 = BLOCK, 2 = no usable verdict.
          STATUS=0
          python scripts/parse_review_verdict.py --reviewer "$ROLE" \
            < "$RUNNER_TEMP/review.txt" > "$RUNNER_TEMP/parsed.txt" || STATUS=$?
          SEVERITY=$(head -1 "$RUNNER_TEMP/parsed.txt")
          tail -n +3 "$RUNNER_TEMP/parsed.txt" > "$RUNNER_TEMP/comment.md"
          echo "verdict: ${SEVERITY:-<none>}"

          # One comment per role, EDITED on re-run. Three reviewers times every
          # push is how a PR becomes unreadable; the workflow-change guard and
          # the spec-conformance gate each learned this separately.
          #
          # A PASS never OPENS a thread -- a clean review is silent. But it does
          # EDIT one this role opened earlier, because otherwise a BLOCK comment
          # outlives the push that fixed it: the PR keeps a comment saying it
          # cannot merge while it merges, and `/agent retry` feeds the next agent
          # a finding no reviewer can retract. A verdict that cannot be withdrawn
          # is not a verdict. Caught by this gate on its own first run.
          MARKER="<!-- review-$ROLE -->"
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            | jq -r --arg m "$MARKER" '.[] | select(.body | startswith($m)) | .id' | tail -1) || EXISTING=""
          WRITE=true
          [ -s "$RUNNER_TEMP/comment.md" ] || WRITE=false
          [ "$SEVERITY" != "PASS" ] || [ -n "$EXISTING" ] || WRITE=false
          if [ "$WRITE" = "true" ]; then
            # Writing the comment is best-effort; the exit code below is the
            # gate. A GitHub hiccup must not turn a WARN into a merge-block, and
            # a PATCH against a comment someone deleted falls back to a POST.
            if [ -n "$EXISTING" ] && gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -F body=@"$RUNNER_TEMP/comment.md" >/dev/null; then
              echo "Edited existing $ROLE comment ($EXISTING)."
            elif gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md" >/dev/null; then
              echo "Posted $ROLE comment."
            else
              echo "::warning::review-$ROLE: could not write its findings comment. The verdict below still stands."
            fi
          fi

          case "$STATUS" in
            0) echo "review-$ROLE: $SEVERITY — not blocking." ;;
            1) echo "::error::review-$ROLE: BLOCK. This is a hard merge-fail; the findings are on the PR." ;;
            *) echo "::error::review-$ROLE: no usable verdict. Failing closed — a reviewer that did not produce a verdict did not review." ;;
          esac
          exit "$STATUS"

