name: CI

on:
  pull_request:
    branches: [main]
    # `labeled` is NOT in the default set (opened, synchronize, reopened), and
    # the auto-merge gate reads labels from the event payload, not live state.
    # `gh pr create --label` is two API calls, so the opened payload can be
    # snapshotted before the label lands. Proven on PR #5: same branch, same
    # label, byte-identical ci.yml -- opened -> Auto-merge skipped,
    # synchronize -> Auto-merge success. Without `labeled`, losing that race is
    # permanent and silent: every check green, no merge, nothing anywhere
    # saying why. Four of five PRs that day won the race; one did not.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  check-project:
    name: Check Project Exists
    runs-on: ubuntu-latest
    outputs:
      has_project: ${{ steps.check.outputs.has_project }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f pyproject.toml ]; then
            echo "has_project=true" >> $GITHUB_OUTPUT
          else
            echo "has_project=false" >> $GITHUB_OUTPUT
            echo "No pyproject.toml — skipping Python checks until project is initialized."
          fi

  # The dispatch PAT (GH_WORKFLOW_PAT) carries `workflow` scope so agents can
  # push changes under .github/workflows/ -- otherwise the factory cannot fix
  # the factory (#19). That scope lets an agent rewrite the CI that gates its
  # own PRs, including this file and the auto-merge conditions below. This job
  # is the compensating control: any PR touching a workflow file gets
  # `human-review` applied HERE, by CI, not by the agent, and auto-merge also
  # checks the output directly so a failed label write cannot open the door.
  # An agent may PROPOSE a change to the rules. It may not land one alone.
  workflow-guard:
    name: Workflow Change Guard
    runs-on: ubuntu-latest
    needs: check-project
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    outputs:
      touches_workflows: ${{ steps.scan.outputs.touches_workflows }}
    steps:
      - id: scan
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          changed=$(gh pr diff "$PR" --repo "${{ github.repository }}" --name-only)
          hits=$(printf '%s\n' "$changed" | grep -E '^\.github/workflows/' || true)
          if [ -z "$hits" ]; then
            echo "touches_workflows=false" >> "$GITHUB_OUTPUT"
            echo "No workflow files changed."
            exit 0
          fi
          echo "touches_workflows=true" >> "$GITHUB_OUTPUT"
          echo "Workflow files changed:"; printf '  %s\n' $hits
          # Idempotent: re-runs on the same PR must not stack comments.
          # REST, not `gh pr view --json`: that goes through GraphQL and needs
          # read:org, which GH_PAT deliberately does not have. Learned on the
          # guard's own first run -- detection worked, this check errored.
          if gh api "repos/${{ github.repository }}/issues/$PR/labels" -q '.[].name' | grep -qx 'human-review'; then
            echo "human-review already present."
            exit 0
          fi
          gh api -X POST "repos/${{ github.repository }}/issues/$PR/labels" -f 'labels[]=human-review' >/dev/null
          # Build the comment in a file: a heredoc inside a YAML block scalar has to
          # stay indented, and markdown bold at column 0 reads as a YAML alias.
          {
            echo '**Workflow Change Guard:** this PR modifies CI/automation under `.github/workflows/`:'
            echo
            printf -- '- `%s`\n' $hits
            echo
            echo '`human-review` has been applied by CI. Auto-merge will not run on this PR regardless of who opened it or what other labels it carries. A human merges changes to the rules.'
            echo
            echo 'Review the workflow diff specifically for: auto-merge conditions, the sequential gate, secrets usage, and the `workflow-guard` job itself.'
          } > "$RUNNER_TEMP/guard-comment.md"
          gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" \
            -F body=@"$RUNNER_TEMP/guard-comment.md" >/dev/null
          echo "::warning::Workflow files changed — human-review applied, auto-merge disabled for this PR."

  harness-lint:
    name: Harness Structure
    runs-on: ubuntu-latest
    needs: check-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate module boundaries
        run: python scripts/validate_harness.py

  hook-tests:
    name: Hook Guards
    runs-on: ubuntu-latest
    needs: check-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      # These hooks fail open when they break -- no exception, no non-zero exit,
      # just a guard quietly allowing what it was written to block. Seven such
      # bugs shipped before this job existed. Reading them did not catch any.
      - name: Test hook guards
        run: .claude/hooks/test-hooks.sh
      # The eighth. The sequential dispatch gate lived inline in a workflow and
      # "assumed satisfied" on any predecessor it could not resolve (issue #11).
      - name: Test dispatch gate
        run: scripts/test-resolve-predecessor.sh

  lint:
    name: Lint & Types
    runs-on: ubuntu-latest
    needs: harness-lint
    if: needs.check-project.outputs.has_project == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy --strict .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    if: needs.check-project.outputs.has_project == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            --tb=short \
            -q
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage
          # Deliberately `warn`, not `error`, and stated rather than defaulted.
          # This step is `if: always()`, so when pytest dies before writing
          # .coverage the file is legitimately absent and a hard failure here
          # would bury the real error under a second, misleading one. Nothing
          # in the repo consumes this artifact -- it is diagnostic, not a gate.
          # The two claude-code-action logs are the opposite case and are set
          # to `error`. The point is that the choice is made, not inherited.
          if-no-files-found: warn

  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    needs: [check-project, workflow-guard, harness-lint, hook-tests, lint, test]
    # hook-tests sits alongside harness-lint, OUTSIDE the has_project branch:
    # the hook guards do not depend on a project existing, and a guard that
    # cannot block a merge is a report, not a gate. Without this clause an
    # agent-authored PR that broke a fail-closed hook would auto-merge green.
    #
    # workflow-guard is checked TWICE: via the human-review label it applies,
    # and via its output directly. The label is what a human sees; the output
    # is what holds if the label write failed. Both must say "no workflow
    # change" for an agent PR to merge itself.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      (
        github.actor == 'claude-code[bot]' ||
        github.actor == 'github-actions[bot]' ||
        contains(github.event.pull_request.labels.*.name, 'agent-task')
      ) &&
      !contains(github.event.pull_request.labels.*.name, 'human-review') &&
      needs.workflow-guard.result == 'success' &&
      needs.workflow-guard.outputs.touches_workflows != 'true' &&
      needs.harness-lint.result == 'success' &&
      needs.hook-tests.result == 'success' &&
      (
        needs.check-project.outputs.has_project == 'false' ||
        (
          needs.lint.result == 'success' &&
          needs.test.result == 'success'
        )
      )
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Auto-merge PR
        uses: pascalgn/automerge-action@v0.16.3
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          MERGE_METHOD: merge
          MERGE_COMMIT_MESSAGE: pull-request-title
          MERGE_LABELS: "agent-task,!human-review"
          MERGE_RETRIES: "6"
          MERGE_RETRY_SLEEP: "10000"

