name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  check-project:
    name: Check Project Exists
    runs-on: ubuntu-latest
    outputs:
      has_project: ${{ steps.check.outputs.has_project }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f pyproject.toml ]; then
            echo "has_project=true" >> $GITHUB_OUTPUT
          else
            echo "has_project=false" >> $GITHUB_OUTPUT
            echo "No pyproject.toml — skipping Python checks until project is initialized."
          fi

  harness-lint:
    name: Harness Structure
    runs-on: ubuntu-latest
    needs: check-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate module boundaries
        run: python scripts/validate_harness.py

  hook-tests:
    name: Hook Guards
    runs-on: ubuntu-latest
    needs: check-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      # These hooks fail open when they break -- no exception, no non-zero exit,
      # just a guard quietly allowing what it was written to block. Seven such
      # bugs shipped before this job existed. Reading them did not catch any.
      - name: Test hook guards
        run: .claude/hooks/test-hooks.sh

  lint:
    name: Lint & Types
    runs-on: ubuntu-latest
    needs: harness-lint
    if: needs.check-project.outputs.has_project == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy --strict .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    if: needs.check-project.outputs.has_project == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            --tb=short \
            -q
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage

  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    needs: [check-project, harness-lint, lint, test]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      (
        github.actor == 'claude-code[bot]' ||
        github.actor == 'github-actions[bot]' ||
        contains(github.event.pull_request.labels.*.name, 'agent-task')
      ) &&
      !contains(github.event.pull_request.labels.*.name, 'human-review') &&
      needs.harness-lint.result == 'success' &&
      (
        needs.check-project.outputs.has_project == 'false' ||
        (
          needs.lint.result == 'success' &&
          needs.test.result == 'success'
        )
      )
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Auto-merge PR
        uses: pascalgn/automerge-action@v0.16.3
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          MERGE_METHOD: merge
          MERGE_COMMIT_MESSAGE: pull-request-title
          MERGE_LABELS: "agent-task,!human-review"
          MERGE_RETRIES: "6"
          MERGE_RETRY_SLEEP: "10000"

