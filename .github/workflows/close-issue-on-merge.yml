name: Close Issue on PR Merge

on:
  pull_request:
    types: [closed]

jobs:
  close-linked-issue:
    name: Close Linked Issue
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'agent-task')
    permissions:
      issues: write
      pull-requests: read
      actions: write
    steps:
      - name: Close linked issue and advance dispatch chain
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const body = context.payload.pull_request.body || '';

            // Extract issue number from "Closes #N" in PR body
            const match = body.match(/Closes\s+#(\d+)/i);
            if (!match) {
              console.log('No Closes #N found in PR body — nothing to close.');
              return;
            }

            const issueNumber = parseInt(match[1]);
            console.log(`Closing issue #${issueNumber}...`);

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed',
            });

            // Leave a comment linking back to the PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `Closed by PR #${context.payload.pull_request.number} — merged into \`main\`. 🤖`,
            });

            console.log(`✅ Issue #${issueNumber} closed.`);

            // ── Auto-advance dispatch chain ──
            // Look for issue N+1 and dispatch if it has the agent-task label
            const nextIssueNumber = issueNumber + 1;
            console.log(`Looking for next issue #${nextIssueNumber}...`);

            let nextIssue;
            try {
              const resp = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: nextIssueNumber,
              });
              nextIssue = resp.data;
            } catch (e) {
              console.log(`No issue #${nextIssueNumber} found — dispatch chain complete.`);
              return;
            }

            if (nextIssue.state !== 'open') {
              console.log(`Issue #${nextIssueNumber} is ${nextIssue.state} — skipping dispatch.`);
              return;
            }

            // Dispatch unconditionally — agent-dispatch.yml handles its own dep-check gate.
            // Issues are created without labels; requiring the label here breaks the chain.
            // Dispatch the agent-dispatch workflow for the next issue
            console.log(`Dispatching agent for issue #${nextIssueNumber}...`);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'agent-dispatch.yml',
              ref: 'main',
              inputs: {
                issue_number: String(nextIssueNumber),
              },
            });

            console.log(`✅ Agent dispatched for issue #${nextIssueNumber}.`);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: nextIssueNumber,
              body: `Auto-advance: Issue #${issueNumber} closed. Dispatching agent for this issue.`,
            });
